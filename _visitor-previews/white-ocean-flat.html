<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White ocean · dark brown land · flat map</title><style>*{box-sizing:border-box}html,body{margin:0}body{background:#f8f6f2;color:#271a16;font-family:Manrope,Arial,sans-serif;padding:48px}.page{max-width:800px;margin:auto;background:#fff;padding:44px 52px 50px;min-height:520px;border:1px solid #e9e3dd}h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}.intro{font-size:15px;line-height:1.6;margin:0 0 28px;color:#6d5c56}.label{font-size:14px;font-weight:500;margin:0 0 10px}.map{width:560px;max-width:100%}.map svg{display:block;width:100%;height:auto}.globe{width:360px}.credit{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#8a7770;text-decoration:none;display:block;margin:6px 0 0;text-align:center}.note{font-size:12px;color:#8a7770;margin-top:18px}</style><script src="./d3-array.min.js"></script><script src="./d3-geo.min.js"></script></head><body><main class="page"><h1>Miscellaneous</h1><p class="intro">I love outdoor activities, figure skating, and snow boarding. I am always down for a coffee chat.</p><p class="label">Visitors around the world</p><div class="map flat" id="map"></div><a class="credit" href="https://feed-pulse.com/site/hazel-heejeong-nam.github.io/traffic">via FeedPulse</a><p class="note">White ocean · dark brown land · flat map · A flat world map with precise coastlines and visitor dots.</p></main><script>
(async function(){const root=document.getElementById('map');const land=await fetch('./world-land.geojson').then(r=>r.json());const mode='flat';const NS='http://www.w3.org/2000/svg';const W=mode==='globe'?360:560,H=mode==='globe'?360:280;const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','Visitor map: white ocean and dark brown land');root.append(svg);function add(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}const proj=mode==='globe'?d3.geoOrthographic().rotate([30,-10]).fitExtent([[8,8],[W-8,H-8]],{type:'Sphere'}):d3.geoEquirectangular().fitExtent([[4,4],[W-4,H-4]],land);document.body.dataset.projection=JSON.stringify({scale:proj.scale(),translate:proj.translate()});const path=d3.geoPath(proj);if(mode==='globe'){add('path',{d:path({type:'Sphere'}),fill:'#fff',stroke:'#d8ccc4','stroke-width':'1.4'});add('path',{d:path(d3.geoGraticule10()),fill:'none',stroke:'#e7ded8','stroke-width':'0.65'});}else{add('rect',{x:0,y:0,width:W,height:H,fill:'#fff'});}add('path',{d:path(land),fill:'#2b1d18',stroke:'#fff','stroke-width':mode==='globe'?'0.35':'0.25'});const xy=proj([-98.1,38.9]);if(xy){add('circle',{cx:xy[0],cy:xy[1],r:7,fill:'#b15b48',opacity:'.18'});add('circle',{cx:xy[0],cy:xy[1],r:3.2,fill:'#b15b48',stroke:'#fff','stroke-width':'1.4'});}})();
</script></body></html>
