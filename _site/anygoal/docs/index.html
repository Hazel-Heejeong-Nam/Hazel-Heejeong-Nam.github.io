<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="description" content="A compositional generalization suite for world model research." />
  <title>AnyGoal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <script>
    (() => {
      const saved = localStorage.getItem("anygoal-theme");
      const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>

<body>
  <header class="topbar">
    <a class="brand" href="../" aria-label="AnyGoal project home">
      <span>AnyGoal</span>
    </a>

    <nav class="project-links" aria-label="Project links">
      <a href="../paper/">Paper Overview</a>
      <a href="https://github.com/galilai-group/AnyGoal">GitHub</a>
      <!-- Replace this placeholder with the AnyGoal paper URL when published. -->
      <a href="https://arxiv.org/">arXiv</a>
      <a href="https://huggingface.co/collections/HazelNam/anygoal">Hugging Face</a>
    </nav>

    <div class="topbar-actions">
      <button class="search-trigger" id="search-trigger" type="button" aria-label="Search documentation">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.2-3.2"></path>
        </svg>
        <span>Search docs</span><kbd>⌘ K</kbd>
      </button>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="sun" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41">
          </path>
        </svg>
        <svg class="moon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"></path>
        </svg>
      </button>
      <button class="menu-button" id="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="page-shell">
    <aside class="sidebar" id="sidebar">
      <nav id="navigation" aria-label="Documentation"></nav>
      <p class="sidebar-note">Benchmark API</p>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <main class="main" id="main" tabindex="-1"></main>

    <aside class="toc" aria-label="On this page">
      <p>On this page</p>
      <nav id="toc"></nav>
    </aside>
  </div>

  <dialog class="search-dialog" id="search-dialog">
    <form method="dialog">
      <div class="search-input-wrap">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.2-3.2"></path>
        </svg>
        <input id="search-input" type="search" placeholder="Search documentation…" autocomplete="off" />
        <button type="submit" aria-label="Close search">ESC</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
  <script src="../assets/app.js"></script>
</body>

</html>
