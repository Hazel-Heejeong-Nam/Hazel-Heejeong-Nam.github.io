<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="landing">
    <h1>AnyGoal</h1>
    <p class="subtitle">
      <span class="visually-hidden">Beyond expert rollout; world model generalization to unseen goal; compositional generalization suite for world models; dissecting goal bias.</span>
      <span class="typed-text" id="typed-text" aria-hidden="true">beyond expert rollout</span>
    </p>
    <nav class="links" aria-label="Project links">
      <a class="link primary" href="paper/">Paper Overview <span aria-hidden="true">↗</span></a>
      <a class="link" href="docs/#/installation"><code>pip install anygoal</code> <span aria-hidden="true">↗</span></a>
      <a class="link" href="https://github.com/galilai-group/AnyGoal">GitHub <span aria-hidden="true">↗</span></a>
      <!-- Replace this placeholder with the AnyGoal paper URL when published. -->
      <a class="link" href="https://arxiv.org/">arXiv <span aria-hidden="true">↗</span></a>
      <a class="link" href="https://huggingface.co/galilai-group">Hugging Face <span aria-hidden="true">↗</span></a>
    </nav>
  </main>
  <script>
    const phrases = [
      "beyond expert rollout",
      "world model generalization to unseen goal",
      "compositional generalization suite for world models",
      "dissecting goal bias",
    ];

    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const typedText = document.querySelector("#typed-text");
      let phraseIndex = 0;
      let characterIndex = 0;
      let deleting = false;
      typedText.textContent = "";

      function typeNext() {
        const phrase = phrases[phraseIndex];
        characterIndex += deleting ? -1 : 1;
        typedText.textContent = phrase.slice(0, characterIndex);

        if (!deleting && characterIndex === phrase.length) {
          deleting = true;
          setTimeout(typeNext, 900);
        } else if (deleting && characterIndex === 0) {
          deleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
          setTimeout(typeNext, 180);
        } else {
          setTimeout(typeNext, deleting ? 22 : 42);
        }
      }

      typeNext();
    }
  </script>
</body>
